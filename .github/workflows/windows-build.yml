name: windows-build

on:
  push:
    branches: [ feature/nearest-neighbor-mask ]
  pull_request:
    branches: [ feature/nearest-neighbor-mask ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v3
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
      - name: qmake
        shell: cmd
        working-directory: AutoSplatoon
        run: |
          "%Qt5_DIR%\\bin\\qmake.exe" AutoSplatoon.pro CONFIG+=release
      - name: build
        shell: cmd
        working-directory: AutoSplatoon
        run: |
          nmake
      - name: deploy
        shell: cmd
        working-directory: AutoSplatoon
        run: |
          if exist release\\AutoSplatoon.exe (
            set EXE=release\\AutoSplatoon.exe
          ) else if exist debug\\AutoSplatoon.exe (
            set EXE=debug\\AutoSplatoon.exe
          ) else (
            for /f "delims=" %%F in ('dir /s /b *.exe ^| findstr /i AutoSplatoon.exe') do set EXE=%%F
          )
          if not defined EXE exit /b 1
          mkdir dist
          copy "%EXE%" dist\\
          "%Qt5_DIR%\\bin\\windeployqt.exe" --release --compiler-runtime "dist\\AutoSplatoon.exe"
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: AutoSplatoon-windows
          path: AutoSplatoon/dist
